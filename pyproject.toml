[project]
name = "rife-fast"
version = "1.0.0"
description = "Fast RIFE 4.25 frame-interpolation pipeline (CUDA + TensorRT)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rife-fast" }]
keywords = ["rife", "frame-interpolation", "tensorrt", "nvenc", "cuda"]

# This repo exists to run RIFE fast: TensorRT (and its ONNX export path) are
# required, not optional.
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "tqdm>=4.66",
    "tensorrt>=10.0",
    "onnx>=1.15",
]

[project.optional-dependencies]
# only for --png output and the PNG comparison tool
png = ["opencv-python>=4.8"]

[project.scripts]
rife-fast = "rife_fast.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rife_fast"]

[tool.ruff]
line-length = 100
target-version = "py310"
# vendored from upstream Practical-RIFE, keep them byte-identical
exclude = ["rife_fast/IFNet_HDv3.py", "rife_fast/warplayer.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
